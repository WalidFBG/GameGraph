[project]
name = "gamegraph"
version = "0.1.0"
description = "GameGraph's model training"
requires-python = ">=3.13,<3.14"
dependencies = [
    "jsonschema",
    "numpy",
    "torch",
]

[project.scripts]
gamegraph-train = "gamegraph.models.train_nodes:main"

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamegraph"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120

[tool.ruff.format]
line-ending = "cr-lf"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
reportUnknownMemberType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
